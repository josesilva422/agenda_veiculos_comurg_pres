<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e4c5a" />
    <title>Sem conexão</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f5f7; color: #0f172a; font-family: system-ui, sans-serif; padding: 1rem; }
      main { max-width: 22rem; text-align: center; background: #fff; border: 1px solid #d8dce2; border-radius: 6px; padding: 1.5rem; }
      h1 { margin: 0 0 .5rem; font-size: 1.1rem; color: #0e4c5a; }
      p { margin: 0 0 1rem; font-size: .9rem; color: #475569; }
      button { background: #0e4c5a; color: #fff; border: 0; border-radius: 4px; padding: .6rem 1.2rem; font-size: .9rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão</h1>
      <p>O Agendamento de Veículos precisa de internet para mostrar os dados atualizados. Verifique a conexão e tente de novo.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
